name: daily
on:
  schedule:
    # 兜底：北京时间周一至周五 18:20 / 21:40（龙虎榜 17 点后才全）。正点靠下面的 repository_dispatch，
    # 一天三轮：15:40 收盘数据、18:40 补龙虎榜和估值、次日 08:40 补两融和 ETF 份额
    - cron: '20 10 * * 1-5'
    - cron: '40 13 * * 1-5'
  # GitHub 定时任务常晚好几个小时（11-02、11-03 都晚了 6~10 小时），正点触发靠私有仓库的 tick 工作流发这个事件
  repository_dispatch:
    types: [collect]
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYYMMDD，留空=按当前时刻判断数据对应的交易日'
        required: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: collect
        id: collect
        run: python scripts/collect.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
      - name: build
        if: steps.collect.outputs.skipped != 'true'
        run: python scripts/build.py
      - name: check
        if: steps.collect.outputs.skipped != 'true'
        run: |
          python tests/test_market.py
          python scripts/check_site.py
      - name: commit data
        if: steps.collect.outputs.skipped != 'true'
        run: |
          git config user.name "a-share-pulse-bot"
          git config user.email "a-share-pulse-bot@users.noreply.github.com"
          git add data site
          D=$(python -c "import json;print(json.load(open('data/last_collect.json'))['date'])")
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore(数据): $D 收盘数据"
          # GitHub 偶发 5xx（11-04 就因此丢了当晚数据）：重试几次；仍失败也继续部署，页面不能因为提交失败而过期，下一次运行会重新采集并提交
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase origin main && git push && exit 0
            echo "提交失败，第 $i 次，等 $((i*20)) 秒重试"; sleep $((i*20))
          done
          echo "::warning::数据提交失败，本次只部署页面"
      # 实操页密文由私有仓库推到 vault 分支（单个提交、强推），部署时放进站点，不进 main 的历史
      - name: vault
        if: vars.PAGES_ON == '1'
        run: |
          if git fetch -q --depth 1 origin vault; then git show FETCH_HEAD:vault.json > site/vault.json; else echo "还没有 vault 分支"; fi
          if git fetch -q --depth 1 origin live; then git show FETCH_HEAD:live.json > site/live.json; else echo "还没有 live 分支"; fi
      - uses: actions/upload-pages-artifact@v3
        if: vars.PAGES_ON == '1'
        with:
          path: site
  deploy:
    needs: update
    if: vars.PAGES_ON == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
