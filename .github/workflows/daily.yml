name: daily
on:
  schedule:
    # 北京时间周一至周五 18:20 / 21:40（龙虎榜 17 点后才全；第二次是补跑兜底，数据没变就不提交）
    - cron: '20 10 * * 1-5'
    - cron: '40 13 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYYMMDD，留空=今天'
        required: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: collect
        run: python scripts/collect.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
      - name: build
        if: hashFiles('scripts/build.py') != ''
        run: python scripts/build.py
      - name: commit data
        run: |
          git config user.name "a-share-pulse-bot"
          git config user.email "a-share-pulse-bot@users.noreply.github.com"
          git add data site
          D=$(python -c "import json;print(json.load(open('data/last_collect.json'))['date'])")
          if git diff --cached --quiet; then echo "no change"; else git commit -m "chore(数据): $D 收盘数据" && git push; fi
      - uses: actions/upload-pages-artifact@v3
        if: vars.PAGES_ON == '1'
        with:
          path: site
  deploy:
    needs: update
    if: vars.PAGES_ON == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
