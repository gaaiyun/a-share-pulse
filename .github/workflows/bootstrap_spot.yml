name: bootstrap-spot
# 一次性：生成近一年的每日个股快照（新浪逐只请求，约一小时）
on:
  workflow_dispatch:
    inputs:
      end:
        description: 'YYYYMMDD，最后一个交易日'
        required: true
      limit:
        description: '试跑只取多少只，0 = 全量并提交'
        default: '30'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/bootstrap_spot.py --end ${{ inputs.end }} --limit ${{ inputs.limit }}
      - name: commit
        if: inputs.limit == '0'
        run: |
          git config user.name "a-share-pulse-bot"
          git config user.email "a-share-pulse-bot@users.noreply.github.com"
          git add data/spot
          git commit -m "chore(数据): 近一年个股快照"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase origin main && git push && exit 0
            sleep $((i*20))
          done
          exit 1
